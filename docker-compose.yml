services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: guardrail-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: guardrail-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # NOTE: IdeaPad Slim 5i has no dedicated GPU. Either skip running
    # this service locally and set OLLAMA_BASE_URL in .env to a
    # Colab/ngrok tunnel instead, or run it anyway for non-generation
    # dev work (Qdrant/auth/FastAPI logic doesn't need the GPU).

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardrail-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - ./app:/code/app
      - ./data:/code/data

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: guardrail-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api
    volumes:
      - ./streamlit_app:/code/streamlit_app

volumes:
  qdrant_data:
  ollama_data:
